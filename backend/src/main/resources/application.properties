server.port=${PORT:8000}
spring.config.import=optional:file:.env[.properties]

app.app-name=${APP_NAME:EntertainHub}
app.app-env=${APP_ENV:development}
app.api-prefix=${API_PREFIX:/api}
app.supabase-url=${SUPABASE_URL}
app.supabase-publishable-key=${SUPABASE_PUBLISHABLE_KEY}
app.supabase-secret-key=${SUPABASE_SECRET_KEY}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.jackson.default-property-inclusion=non_null
